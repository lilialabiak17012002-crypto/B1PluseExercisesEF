<!DOCTYPE html>
<html lang="uk"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>to + verb or verb-ing? Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#4f7cff;--green:#22a06b;--red:#e5484d;--ink:#1e2433;--muted:#6b7280;--bg:#f6f7fb;}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:var(--bg);}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:28px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px;font-size:15px}
.card{background:#fff;border-radius:18px;padding:20px 22px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.pill{border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.pill.to{background:#eaf0ff;color:var(--blue)}.pill.ing{background:#e6f6ee;color:var(--green)}
input[type=text]{font:inherit;border:2px solid #dfe3ea;border-radius:10px;padding:8px 12px;outline:none;transition:border-color .15s}
input[type=text]:focus{border-color:var(--blue)}
ol{margin:0;padding:0;list-style:none;counter-reset:q}
li.q{counter-increment:q;padding:14px 0;border-bottom:1px dashed #e5e7eb;line-height:2.1;font-size:17px}
li.q:last-child{border-bottom:none}
li.q::before{content:counter(q) ".";font-weight:600;color:var(--muted);margin-right:8px;display:inline-block;min-width:26px}
li.q input{width:150px;padding:4px 10px;margin:0 4px}
.hint{color:var(--muted);font-style:italic}
li.q.ok input{border-color:var(--green);background:#effaf4}
li.q.bad input{border-color:var(--red);background:#fff1f1}
.fix{display:none;margin-left:34px;font-size:15px;line-height:1.5}
li.q.bad .fix{display:block;color:var(--red)}
li.q.ok .fix.both{display:block;color:var(--green)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
button{font:inherit;font-weight:600;border:none;border-radius:12px;padding:12px 22px;cursor:pointer}
.primary{background:var(--blue);color:#fff}.primary:disabled{opacity:.5;cursor:default}
.ghost{background:#eef0f5;color:var(--ink)}
#result{display:none;text-align:center}
#score{font-size:44px;font-weight:700;margin:4px 0}
.shot{font-size:15px;color:var(--muted);margin-top:8px}
</style>
</head>
<body><div class="wrap">
<h1>to + verb or verb-ing?</h1>
<p class="sub">Встав дієслово з дужок у правильній формі. Пиши <b>to + verb</b> (наприклад, <i>to stay</i>) або <b>verb-ing</b> (наприклад, <i>staying</i>).</p>
<div class="card" style="padding:14px 22px">
  <div class="legend" style="margin-top:0"><span class="pill to">to + verb</span><span class="pill ing">verb-ing</span></div>
</div>
<div class="card"><ol id="list"></ol></div>
<div class="card"><div class="btns"><button class="primary" id="check">Перевірити</button></div></div>
<div class="card" id="result">
  <div>Твій результат</div>
  <div id="score"></div>
  <div class="shot">📸 Зроби скріншот і надішли вчительці.</div>
  <div class="btns" style="justify-content:center;margin-top:14px"><button class="ghost" id="again">Спробувати ще раз</button></div>
</div>
</div>
<script>
// [sentence before, verb, sentence after, accepted answers]
const Q = [
 ["I decided","stay","at home last night.",["to stay"]],
 ["I really enjoy","cook","for my friends.",["cooking"]],
 ["You need","drink","more water.",["to drink"]],
 ["Have you finished","write","your essay?",["writing"]],
 ["He promised","call","me after work.",["to call"]],
 ["Would you mind","open","the window?",["opening"]],
 ["I want","visit","Canada next year.",["to visit"]],
 ["I hate","get up","early on Mondays.",["getting up","to get up"]],
 ["Don't forget","lock","the door!",["to lock"]],
 ["I spend a lot of time","read","the news.",["reading"]],
 ["My friend offered","help","me with the move.",["to help"]],
 ["Please stop","make","so much noise!",["making"]],
 ["Remember","buy","some bread on your way home.",["to buy"]],
 ["Do you like","watch","horror films?",["watching","to watch"]],
 ["I would like","order","a cappuccino, please.",["to order"]],
 ["She went on","talk","after the teacher came in.",["talking"]],
 ["We hope","see","you soon.",["to see"]],
 ["I don't feel like","go","out tonight.",["going"]],
 ["They are planning","open","a small café.",["to open"]],
 ["My parents love","travel","by train.",["travelling","traveling","to travel"]],
 ["My little sister is learning","swim","this summer.",["to swim"]],
 ["It started","rain","in the afternoon.",["to rain","raining"]],
 ["The cat pretended","sleep","when I came in.",["to sleep"]],
 ["I'll try","finish","the report by Friday.",["to finish"]],
];
const list=document.getElementById('list');
Q.forEach((q,i)=>{
  const li=document.createElement('li'); li.className='q';
  li.append(q[0]+' ');
  const inp=document.createElement('input'); inp.type='text'; inp.autocomplete='off'; inp.spellcheck=false;
  inp.setAttribute('autocapitalize','off'); inp.setAttribute('aria-label','Answer '+(i+1));
  li.append(inp);
  const h=document.createElement('span'); h.className='hint'; h.textContent='('+q[1]+')';
  li.append(' ',h,' '+q[2]);
  const fix=document.createElement('div'); fix.className='fix'; li.append(fix);
  list.append(li);
});
const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:]/g,' ').replace(/\s+/g,' ').trim();
const $=id=>document.getElementById(id);
$('check').onclick=()=>{
  let score=0;
  [...list.children].forEach((li,i)=>{
    const inp=li.querySelector('input'), fix=li.querySelector('.fix');
    const ok=Q[i][3].includes(norm(inp.value));
    const opts=Q[i][3].filter(a=>a!=='traveling');
    li.classList.remove('ok','bad'); li.classList.add(ok?'ok':'bad');
    fix.className='fix'; fix.textContent='';
    if(ok){ score++; if(opts.length>1){ fix.classList.add('both'); fix.textContent='✓ Тут можна і так, і так: '+opts.join(' / '); } }
    else fix.textContent='✗ Правильно: '+opts.join(' / ');
    inp.readOnly=true;
  });
  $('check').disabled=true;
  $('result').style.display='block';
  $('score').textContent=score+' / '+Q.length;
  $('result').scrollIntoView({behavior:'smooth'});
};
$('again').onclick=()=>{
  [...list.children].forEach(li=>{li.classList.remove('ok','bad');const i=li.querySelector('input');i.value='';i.readOnly=false;const f=li.querySelector('.fix');f.textContent='';f.className='fix';});
  $('check').disabled=false; $('result').style.display='none'; window.scrollTo({top:0,behavior:'smooth'});
};
</script>
</body></html>
