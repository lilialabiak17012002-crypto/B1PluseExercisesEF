<div id="secs"></div>

</div><script>const SECS=[{"type": "match", "n": 1, "title": "Health words", "task": "Look at the picture and the description. Choose the correct word.", "pool": ["bad cold", "blood pressure", "blood test", "blow", "breathe", "chicken soup", "doctor", "drink fluids", "hearing", "hiccups", "hold your breath", "nurse", "weight"], "items": [["👨‍⚕️ The person who checks your health and tells you what is wrong.", "doctor"], ["👩‍⚕️ The person who takes care of you in hospital and helps the doctor.", "nurse"], ["⚖️ How heavy you are, in kilos.", "weight"], ["💉 The nurse takes some blood from your arm to check it.", "blood test"], ["🩺 The nurse measures it to check that your heart is healthy.", "blood pressure"], ["👂 Your ability to hear sounds.", "hearing"], ["🤧 You have a red nose, a sore throat and you feel terrible.", "bad cold"], ["🥤 Drink a lot of water, tea or juice.", "drink fluids"], ["🍲 A warm meal that many people eat when they're ill.", "chicken soup"], ["😮 A funny sound from your throat that you can't stop: \"hic!\"", "hiccups"], ["🌬️ Take air in and out through your nose or mouth.", "breathe"], ["🤐 Stop breathing for a few seconds.", "hold your breath"], ["🌀 Push air out of your mouth, e.g. to make a candle go out.", "blow"]]}, {"type": "text", "n": 2, "title": "At the doctor's", "task": "Complete the sentences with words from the box.", "bank": ["blood pressure", "blood test", "breathe", "chicken soup", "cold", "doctor", "drink", "fluids", "hearing", "hiccups", "hold your breath", "nurse", "weight"], "items": [{"t": "When you visit the [?], they will check your temperature and ask about your symptoms.", "a": [["doctor"]]}, {"t": "A [?] will take care of you in the hospital and help the doctor.", "a": [["nurse"]]}, {"t": "To check for illnesses, the doctor might ask you to have a [?].", "a": [["blood test"]]}, {"t": "If you have a bad [?], you should rest, [?] a lot of [?], and eat healthy food.", "a": [["cold"], ["drink"], ["fluids"]]}, {"t": "Eating warm [?] can help you feel better when you're sick.", "a": [["chicken soup"]]}, {"t": "The nurse will measure your [?] to make sure your heart is healthy.", "a": [["blood pressure"]]}, {"t": "If you think you're losing your [?], visit a specialist to test your ears.", "a": [["hearing"]]}, {"t": "To stop the [?], try to [?] for a few seconds and then breathe out slowly.", "a": [["hiccups"], ["hold your breath"]]}, {"t": "If you can't [?] easily, you should see a doctor right away.", "a": [["breathe"]]}, {"t": "The gym trainer asked me to check my [?] after two weeks of exercise.", "a": [["weight"]]}]}, {"type": "explain", "html": "<h2><span class='num'>i</span>Повторення: модальні дієслова</h2><table><tr><td><b>should</b></td><td>раджу зробити</td><td><span class='ex'>You should drink more water.</span></td></tr><tr><td><b>shouldn't</b></td><td>не раджу, погана ідея</td><td><span class='ex'>You shouldn't go to work today.</span></td></tr><tr><td><b>must / have to</b></td><td>обов'язково, це важливо</td><td><span class='ex'>She has to wear a uniform. You must take this medicine.</span></td></tr><tr><td><b>mustn't</b></td><td>заборонено</td><td><span class='ex'>You mustn't park here. It's only for ambulances.</span></td></tr><tr><td><b>don't / doesn't have to</b></td><td>не обов'язково</td><td><span class='ex'>He doesn't have to work at night.</span></td></tr></table><p><b style='color:#e5484d'>❗ mustn't (заборонено) ≠ don't have to (не обов'язково)</b></p>"}, {"type": "text", "n": 3, "title": "Claire's new job", "task": "Claire is a doctor. She has just started her new job. Complete the sentences with must or have to in the correct form, positive or negative.", "items": [{"t": "She [?] wear a white coat when meeting patients. It's part of her uniform.", "a": [["has to", "must"]]}, {"t": "She [?] wash her hands before and after seeing each patient. Hygiene is very important.", "a": [["has to", "must"]]}, {"t": "She [?] be on time. Punctuality is very important in her job.", "a": [["has to", "must"]]}, {"t": "She [?] perform surgery. She is not a surgeon.", "a": [["does not have to"]]}, {"t": "She [?] answer patient calls late at night. She is on call every other week.", "a": [["has to", "must"]]}, {"t": "She [?] park her car in the emergency area. That space is only for ambulances.", "a": [["must not"]]}]}, {"type": "choice", "n": 4, "title": "What's the best advice?", "task": "Choose the best option.", "items": [{"t": "I've got a bad cold. → You ___ stay in bed and drink a lot of fluids.", "o": ["should", "mustn't", "don't have to"], "c": 0}, {"t": "I've got hiccups! → You ___ hold your breath for ten seconds.", "o": ["mustn't", "should", "don't have to"], "c": 1}, {"t": "The doctor says I have high blood pressure. → You ___ eat so much salt.", "o": ["have to", "should", "shouldn't"], "c": 2}, {"t": "Patients ___ use their phones in the hospital. It's a rule.", "o": ["mustn't", "don't have to", "should"], "c": 0}, {"t": "It's only a small cut. You ___ go to hospital.", "o": ["mustn't", "don't have to", "have to"], "c": 1}, {"t": "Before the blood test you ___ eat anything. It's very important.", "o": ["shouldn't", "don't have to", "mustn't"], "c": 2}, {"t": "This medicine is very strong. You ___ take it with food.", "o": ["must", "mustn't", "don't have to"], "c": 0}, {"t": "You look tired. You ___ work so hard.", "o": ["mustn't", "shouldn't", "don't have to"], "c": 1}, {"t": "The nurse says my dad ___ come back next week. It's not necessary.", "o": ["mustn't", "has to", "doesn't have to"], "c": 2}, {"t": "My weight is too high. I ___ do more exercise.", "o": ["should", "shouldn't", "mustn't"], "c": 0}]}, {"type": "explain", "html": "<h2><span class='num'>i</span>Повторення: get</h2><p><b>get</b> + прикметник = become (<span class='ex'>get angry, get married, get lost</span>) · <b>get</b> + comparative (<span class='ex'>get better, get worse</span>) · <b>get</b> = buy / obtain (<span class='ex'>get a job, get tickets</span>) · <b>get</b> = receive (<span class='ex'>get a message, get a present</span>) · <b>get (to)</b> = arrive (<span class='ex'>get home, get to work</span>) · <b>get on with / get up</b></p><p>⚠️ Не забувай про <b>правильну форму</b>: <span class='ex'>got, getting, gets</span>.</p>"}, {"type": "text", "n": 5, "title": "Revision: get", "task": "Complete the sentences with the correct form of get and a word from the box.", "bank": ["angry", "better", "colder", "divorced", "fit", "home", "job", "lost", "married", "message", "nervous", "newspaper", "on", "present", "tickets", "to", "up", "worse"], "items": [{"t": "I go swimming twice a week because I want to [?].", "a": [["get fit"]]}, {"t": "They were together for 15 years, but they [?] in 2023.", "a": [["got divorced"]]}, {"t": "It's my mum's birthday tomorrow. I need to [?] her a [?].", "a": [["get"], ["present"]]}, {"t": "What time do you usually [?] after work?", "a": [["get home"]]}, {"t": "I hate [?] early in winter. It's so dark!", "a": [["getting up"]]}, {"t": "We should [?] for the festival now, before they sell out.", "a": [["get tickets"]]}, {"t": "I don't know this city. I'm sure I'll [?].", "a": [["get lost"]]}, {"t": "My sister and her boyfriend are [?] next summer!", "a": [["getting married"]]}, {"t": "Do you [?] well with your colleagues?", "a": [["get on"]]}, {"t": "I always [?] before I speak in public.", "a": [["get nervous"]]}, {"t": "You've had a bad cold. I hope you [?] soon!", "a": [["get better"]]}, {"t": "My dad [?] a [?] every morning, but I read the news on my phone.", "a": [["gets"], ["newspaper"]]}, {"t": "It's November. It's [?] every day.", "a": [["getting colder"]]}, {"t": "How do you [?] work? By car?", "a": [["get to"]]}, {"t": "The traffic in our city isn't getting better. It's [?].", "a": [["getting worse"]]}, {"t": "She studied hard and finally [?] a [?] in a big company.", "a": [["got"], ["job"]]}, {"t": "I [?] a [?] from Anna. She says she's going to be late.", "a": [["got"], ["message"]]}, {"t": "My dad [?] very [?] when people drive too fast near our house.", "a": [["gets"], ["angry"]]}]}];
const show={"have not":"haven't","has not":"hasn't","was not":"wasn't","were not":"weren't","did not":"didn't","is not":"isn't","are not":"aren't","does not":"doesn't","do not":"don't","am not":"'m not"};
function norm(s){
  s=' '+s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:]/g,' ')+' ';
  s=s.replace(/won't/g,'will not').replace(/n't/g,' not').replace(/'s /g,' is ').replace(/'m /g,' am ').replace(/'re /g,' are ').replace(/'ve /g,' have ');
  return s.replace(/\s+/g,' ').trim();
}
function normL(s){s=norm(s.replace(/-/g,' ')).replace(/\bper cent\b/g,'percent').replace(/\band\b/g,' ').replace(/^a /,'one ');return s.replace(/\s+/g,' ').trim();}
const pretty=a=>{for(const k in show)a=a.replace(k,show[k]);return a;};
const mk=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const wrap=document.getElementById('secs'); const checks=[];
SECS.forEach((sec,si)=>{
  const card=mk('div','card'+(sec.type==='explain'?' explain':''));
  if(sec.type==='explain'){card.innerHTML=sec.html;wrap.append(card);return;}
  const h=mk('h2');h.append(mk('span','num',String(sec.n)),sec.title);const sc=mk('span','secscore');h.append(sc);card.append(h);
  card.append(mk('p','task',sec.task));
  if(sec.bank){const b=mk('div','bank');sec.bank.forEach(w=>b.append(mk('span','',w)));card.append(b);}
  const ol=mk('ol');card.append(ol);wrap.append(card);
  const fns=[];
  sec.items.forEach(it=>{
    const li=mk('li','q');ol.append(li);const fix=mk('div','fix');
    if(sec.type==='match'){
      li.append(mk('span','word',it[0]));const s=mk('select');s.append(new Option('— вибери —',''));
      sec.pool.forEach(p=>s.append(new Option(p,p)));li.append(s,fix);
      fns.push(()=>{const ok=s.value===it[1];s.disabled=true;fix.textContent=ok?'':'✗ Правильно: '+it[1];return [li,ok];});
      li._reset=()=>{s.value='';s.disabled=false;};
    } else if(sec.type==='choice'){
      const parts=it.t.split('___');let pick=-1;li.append(parts[0]);
      const o=mk('span','opts');it.o.forEach((w,k)=>{const b=mk('button','opt',w);b.type='button';b.onclick=()=>{if(li.dataset.done)return;pick=k;o.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};o.append(b);});
      li.append(o,parts[1]||'',fix);
      fns.push(()=>{const ok=pick===it.c;o.querySelectorAll('.opt').forEach((b,k)=>{b.classList.remove('sel');if(k===it.c)b.classList.add('right');else if(k===pick)b.classList.add('wrong');});fix.textContent=ok?'':'✗ Правильно: '+it.o[it.c];return [li,ok];});
      li._reset=()=>{pick=-1;o.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel','right','wrong'));};
    } else if(sec.type==='order'){
      li.append(mk('span','hint',it.t),mk('br'));const inp=mk('input','wide');inp.type='text';inp.autocomplete='off';inp.spellcheck=false;li.append(inp,fix);
      fns.push(()=>{const ok=it.a.some(a=>norm(a)===norm(inp.value));inp.readOnly=true;fix.textContent=ok?'':'✗ Правильно: '+it.a[0];return [li,ok];});
      li._reset=()=>{inp.value='';inp.readOnly=false;};
    } else {
      const segs=it.t.split(/\[([^\]]+)\]/);const ins=[];
      segs.forEach((s,k)=>{if(k%2===0){li.append(s);}else{const inp=mk('input');inp.type='text';inp.autocomplete='off';inp.spellcheck=false;inp.setAttribute('autocapitalize','off');ins.push(inp);li.append(inp,' ',mk('span','hint','('+s+')'));}});
      li.append(fix);
      fns.push(()=>{let all=true;const corr=[];ins.forEach((inp,k)=>{const acc=it.a[k];const N=sec.loose?normL:norm;const g=N(inp.value);const ok=acc.some(a=>N(a)===g)||acc.some(a=>/^has /.test(a)&&a.replace(/^has /,'is ')===g);inp.readOnly=true;inp.classList.add(ok?'ok1':'bad1');if(!ok)all=false;corr.push(acc.map(pretty).filter((v,j,a)=>a.indexOf(v)===j).join(' / '));});
        fix.textContent=all?'':'✗ Правильно: '+corr.join('  …  ');return [li,all];});
      li._reset=()=>{ins.forEach(i=>{i.value='';i.readOnly=false;i.classList.remove('ok1','bad1');});};
    }
  });
  checks.push({fns,sc,n:sec.items.length,ol});
});
const $=id=>document.getElementById(id);
$('check').onclick=()=>{let t=0,m=0;checks.forEach(c=>{let s=0;c.fns.forEach(f=>{const [li,ok]=f();li.dataset.done='1';li.classList.add(ok?'ok':'bad');if(ok)s++;});c.sc.textContent=s+' / '+c.n;t+=s;m+=c.n;});
  $('check').disabled=true;$('result').style.display='block';$('score').textContent=t+' / '+m;$('result').scrollIntoView({behavior:'smooth'});};
$('again').onclick=()=>{document.querySelectorAll('li.q').forEach(li=>{li.classList.remove('ok','bad');delete li.dataset.done;li.querySelector('.fix').textContent='';li._reset&&li._reset();});
  checks.forEach(c=>c.sc.textContent='');$('check').disabled=false;$('result').style.display='none';window.scrollTo({top:0,behavior:'smooth'});};
</script></body></html>
