<!DOCTYPE html>
<html lang="uk"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Act your age</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#4f7cff;--green:#22a06b;--red:#e5484d;--ink:#1e2433;--muted:#6b7280;--bg:#f6f7fb;}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:var(--bg);}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:28px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px;font-size:15px}
.card{background:#fff;border-radius:18px;padding:20px 22px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.pill{border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.pill.to{background:#eaf0ff;color:var(--blue)}.pill.ing{background:#e6f6ee;color:var(--green)}.pill.sh{background:#fff3e0;color:#d9822b}
label.name{display:block;font-weight:600;margin-bottom:6px}
input[type=text]{font:inherit;border:2px solid #dfe3ea;border-radius:10px;padding:8px 12px;outline:none;transition:border-color .15s}
input[type=text]:focus{border-color:var(--blue)}
#name{width:100%;max-width:340px}
ol{margin:0;padding:0;list-style:none;counter-reset:q}
li.q{counter-increment:q;padding:14px 0;border-bottom:1px dashed #e5e7eb;line-height:2.1;font-size:17px}
li.q:last-child{border-bottom:none}
li.q::before{content:counter(q) ".";font-weight:600;color:var(--muted);margin-right:8px;display:inline-block;min-width:26px}
li.q input{width:190px;padding:4px 10px;margin:0 4px}
.hint{color:var(--muted);font-style:italic}
li.q.ok input{border-color:var(--green);background:#effaf4}
li.q.bad input{border-color:var(--red);background:#fff1f1}
.fix{display:none;margin-left:34px;font-size:15px;line-height:1.5}
li.q.bad .fix{display:block;color:var(--red)}
li.q.ok .fix.both{display:block;color:var(--green)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
button{font:inherit;font-weight:600;border:none;border-radius:12px;padding:12px 22px;cursor:pointer}
.primary{background:var(--blue);color:#fff}.primary:disabled{opacity:.5;cursor:default}
.ghost{background:#eef0f5;color:var(--ink)}
#result{display:none;text-align:center}
#score{font-size:44px;font-weight:700;margin:4px 0}
#status{font-size:15px;margin-top:6px}
.err{color:var(--red);font-size:14px;margin-top:6px;display:none}
#teacher{display:none}
#teacher h2{margin:0 0 12px;font-size:20px}
.att{border:1px solid #e5e7eb;border-radius:12px;padding:10px 14px;margin-bottom:8px}
.att summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.att .s{font-weight:700}
.att ul{margin:8px 0 2px;padding-left:18px;font-size:14px}
.att .when{color:var(--muted);font-size:13px}
.rule{color:var(--muted);font-size:13px;display:block}
.shot{font-size:15px;color:var(--muted);margin-top:8px}

h2{font-size:20px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.num{background:var(--blue);color:#fff;border-radius:10px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.task{color:var(--muted);margin:0 0 6px;font-size:15px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.bank span{background:#f2f6ff;color:var(--blue);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600}
.secscore{margin-left:auto;font-size:14px;font-weight:600;color:var(--muted)}
.opts{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle;margin:0 4px}
.opt{font:inherit;font-size:15px;font-weight:500;border:2px solid #dfe3ea;background:#fff;border-radius:10px;padding:3px 12px;cursor:pointer;color:var(--ink)}
.opt.sel{border-color:var(--blue);background:#eaf0ff}
.opt.right{border-color:var(--green);background:#effaf4}
.opt.wrong{border-color:var(--red);background:#fff1f1}
li.q input{width:170px} li.q input.wide{width:min(460px,92%)}
li.q select{font:inherit;font-size:16px;border:2px solid #dfe3ea;border-radius:10px;padding:4px 8px;margin-left:8px;background:#fff;color:var(--ink)}
li.q.ok select{border-color:var(--green);background:#effaf4} li.q.bad select{border-color:var(--red);background:#fff1f1}
li.q input.ok1{border-color:var(--green);background:#effaf4} li.q input.bad1{border-color:var(--red);background:#fff1f1}
.word{font-weight:600;font-size:18px}
.explain{background:#f2f6ff;border-left:5px solid var(--blue)}
.explain h2{margin-bottom:10px}
.explain p{margin:6px 0;font-size:15.5px;line-height:1.55}
.explain table{border-collapse:collapse;width:100%;margin:8px 0 10px;font-size:15px}
.explain td,.explain th{border:1px solid #d6def5;padding:7px 10px;text-align:left;vertical-align:top;background:#fff}
.explain th{background:#e3eaff}
.explain .ex{color:var(--blue);font-style:italic}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;margin-right:6px}
.tag.ps{background:#e6f6ee;color:var(--green)} .tag.pc{background:#eaf0ff;color:var(--blue)}
</style>
</head>
<body><div class="wrap">
<!-- site-nav --><style>.sitenav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}.sitenav a{font:500 14px Poppins,system-ui,sans-serif;color:#6b7280;text-decoration:none;background:#fff;border-radius:999px;padding:6px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}.sitenav a:hover{color:#4f7cff}</style><nav class="sitenav"><a href="/b2">← Усі уроки B2</a><a href="/">Усі рівні</a></nav><!-- /site-nav -->

<h1>Act your age</h1><p class="sub">B2 · Adjectives as nouns · Adjective order · Personality</p>
<div id="secs"></div>
<div class="card"><div class="btns"><button class="primary" id="check">Перевірити</button></div></div>
<div class="card" id="result"><div>Твій результат</div><div id="score"></div>
<div class="shot">📸 Зроби скріншот і надішли вчительці.</div>
<div class="btns" style="justify-content:center;margin-top:14px"><button class="ghost" id="again">Спробувати ще раз</button></div></div>
</div><script>const SECS=[{"type": "explain", "html": "<h2><span class='num'>i</span>Personality adjectives</h2><table><tr><th>Слово</th><th>Значення</th></tr><tr><td><b>active</b></td><td>активний, багато рухається</td></tr><tr><td><b>brave</b></td><td>сміливий</td></tr><tr><td><b>energetic</b></td><td>енергійний</td></tr><tr><td><b>funny</b></td><td>смішний, з почуттям гумору</td></tr><tr><td><b>glamorous</b></td><td>гламурний, ефектний, стильний</td></tr><tr><td><b>impulsive</b></td><td>імпульсивний, діє не подумавши</td></tr><tr><td><b>independent</b></td><td>незалежний, самостійний</td></tr><tr><td><b>lively</b></td><td>жвавий, сповнений життя</td></tr><tr><td><b>open-minded</b></td><td>відкритий до нового</td></tr><tr><td><b>sociable</b></td><td>товариський, любить спілкуватися</td></tr></table><p><b style='color:#e5484d'>❗ funny ≠ fun:</b> <i>funny</i> — той, хто смішить; <i>fun</i> — з ким цікаво і весело проводити час.</p>"}, {"type": "match", "n": 1, "title": "Personality", "task": "Match the descriptions with the adjectives.", "items": [["She goes to the gym, swims and hikes every week.", "active"], ["He wasn't afraid to jump into the river to save the dog.", "brave"], ["My grandma never gets tired. She's always doing something.", "energetic"], ["He always makes everybody laugh.", "funny"], ["She always wears beautiful dresses and looks like a film star.", "glamorous"], ["He often does things without thinking first.", "impulsive"], ["She doesn't need anybody's help. She does everything herself.", "independent"], ["He's full of life and energy, and loves talking and laughing.", "lively"], ["She's happy to listen to new ideas, even strange ones.", "open-minded"], ["He loves meeting people and going to parties.", "sociable"]], "pool": ["active", "brave", "energetic", "funny", "glamorous", "impulsive", "independent", "lively", "open-minded", "sociable"]}, {"type": "explain", "html": "<h2><span class='num'>i</span>Adjectives as nouns</h2><p>Деякі прикметники з артиклем <b>the</b> можуть означати <b>цілу групу людей</b>:</p><p class='ex'><b>the young</b> = young people, <b>the old / the elderly</b> = old people<br><b>the rich</b>, <b>the poor</b>, <b>the unemployed</b> (безробітні), <b>the homeless</b> (бездомні)<br><b>the sick</b> (хворі), <b>the injured</b> (поранені), <b>the disabled</b> (люди з інвалідністю), <b>the blind</b> (незрячі), <b>the deaf</b> (нечуючі), <b>the dead</b> (загиблі)</p><p class='ex'><b>The poor</b> are getting poorer, and <b>the rich</b> are getting richer.</p><p>Так само з <b>національностями на -ch, -sh, -ese, -ss</b>: <span class='ex'>the French, the Spanish, the British, the Irish, the Dutch, the Chinese, the Japanese, the Swiss</span>. Інші національності — це звичайні іменники у множині: <span class='ex'>the Brazilians, the Poles, the Turks, the Ukrainians</span>.</p><p>Можна також сказати <b>прикметник + people</b>: <span class='ex'>poor people, homeless people, French people</span>.</p><p><b style='color:#e5484d'>❗ Дієслово після the + adjective — у множині:</b> <span class='ex'>The rich <b>are</b>… ✓ &nbsp;<s>The rich is…</s> ✗</span></p><p><b style='color:#e5484d'>❗ Про ОДНУ людину так не кажемо:</b> <span class='ex'><s>a Japanese, a rich</s> ✗ → a Japanese woman, a rich man ✓</span></p>"}, {"type": "text", "n": 2, "title": "the + adjective", "task": "Complete the sentences with the + an adjective from the box.", "bank": ["blind", "deaf", "disabled", "elderly", "homeless", "injured", "rich", "unemployed", "young"], "items": [{"t": "In many villages, [?] live alone because their children have moved to the city.", "a": [["the elderly"]]}, {"t": "The new programme helps [?] to find work.", "a": [["the unemployed"]]}, {"t": "After the bus crash, [?] were taken to three different hospitals.", "a": [["the injured"]]}, {"t": "All the new buses have a ramp for [?].", "a": [["the disabled"]]}, {"t": "Some people think that [?] should pay much higher taxes.", "a": [["the rich"]]}, {"t": "Guide dogs help [?] to cross the road safely.", "a": [["the blind"]]}, {"t": "[?] often know much more about technology than their parents.", "a": [["The young"]]}, {"t": "Many TV channels now show the news in sign language for [?].", "a": [["the deaf"]]}, {"t": "In winter, volunteers bring hot food to [?] in the city centre.", "a": [["the homeless"]]}]}, {"type": "text", "n": 3, "title": "Nationalities", "task": "Complete the sentences with the + the word for the people from the country in brackets.", "items": [{"t": "[Netherlands] are famous for riding bikes everywhere.", "a": [["The Dutch"]]}, {"t": "[Japan] celebrate the cherry blossom season in spring.", "a": [["The Japanese"]]}, {"t": "[Brazil] are crazy about football.", "a": [["The Brazilians"]]}, {"t": "[Switzerland] are known for being very punctual.", "a": [["The Swiss"]]}, {"t": "[Spain] usually have dinner very late.", "a": [["The Spanish", "The Spaniards"]]}, {"t": "[Poland] celebrate Christmas Eve with twelve dishes, just like Ukrainians.", "a": [["The Poles"]]}, {"t": "[France] think that their bread is the best in the world.", "a": [["The French"]]}, {"t": "[Ireland] celebrate St Patrick's Day on 17th March.", "a": [["The Irish"]]}]}, {"type": "explain", "html": "<h2><span class='num'>i</span>Adjective order</h2><p>Перед іменником можна поставити 2–3 прикметники, але в <b>певному порядку</b>:</p><p>1️⃣ Спочатку <b>думка</b> (opinion: beautiful, lovely, nice, expensive), потім <b>факти</b> (big, old, round…).</p><p>2️⃣ Факти йдуть у такому порядку:</p><table><tr><th>Opinion</th><th>Size</th><th>Age</th><th>Shape</th><th>Colour</th><th>Pattern</th><th>Origin</th><th>Material</th><th>NOUN</th></tr><tr><td>beautiful<br>expensive</td><td>big<br>little</td><td>old<br>new</td><td>round<br>long</td><td>red<br>purple</td><td>striped<br>spotted</td><td>Italian<br>French</td><td>silk<br>leather</td><td>scarf<br>bag</td></tr></table><p class='ex'>We've got a <b>lovely old</b> cottage. She has <b>long fair</b> hair. I bought a <b>beautiful Italian leather</b> belt.</p><p><b>Підказка:</b> <b>OSASCOMP</b> = Opinion, Size, Age, Shape, Colour, Origin, Material, Purpose.</p><p><b style='color:#e5484d'>❗ Opinion завжди першим:</b> <span class='ex'><s>an old lovely cottage</s> ✗ → a lovely old cottage ✓</span></p><p><b style='color:#e5484d'>❗ Матеріал завжди останнім перед іменником:</b> <span class='ex'><s>a leather black jacket</s> ✗ → a black leather jacket ✓</span></p><p><b style='color:#e5484d'>❗ a → an</b>, якщо перший прикметник починається з голосного звука: <span class='ex'>an old car, an expensive bag, an Italian pizza</span>.</p>"}, {"type": "choice", "n": 4, "title": "Right or wrong?", "task": "Choose the phrase with the correct adjective order.", "items": [{"t": "Olena is wearing ___.", "o": ["a short denim skirt", "a denim short skirt"], "c": 0}, {"t": "I'm looking for ___.", "o": ["a cotton sleeveless top", "a sleeveless cotton top"], "c": 1}, {"t": "He wants to buy ___.", "o": ["some leather black boots", "some black leather boots"], "c": 1}, {"t": "You can't wear ___ to the interview!", "o": ["those old scruffy jeans", "those scruffy old jeans"], "c": 1}, {"t": "She got ___ for her birthday.", "o": ["a silk spotted scarf", "a spotted silk scarf"], "c": 1}, {"t": "He looks amazing in his ___.", "o": ["new grey Armani suit", "grey new Armani suit"], "c": 0}, {"t": "My grandma knitted me ___.", "o": ["a woollen bright red jumper", "a bright red woollen jumper"], "c": 1}, {"t": "Max has bought some ___.", "o": ["trendy purple glasses", "purple trendy glasses"], "c": 0}]}, {"type": "order", "n": 5, "title": "Put the adjectives in the right place", "task": "Write the adjectives in brackets in the correct place. Change a to an where necessary.", "items": [{"t": "a woman (young / elegant)", "a": ["an elegant young woman"]}, {"t": "trainers (dirty / old)", "a": ["dirty old trainers"]}, {"t": "a coat (wool / grey / lovely)", "a": ["a lovely grey wool coat"]}, {"t": "a boy (tall / Canadian / teenage)", "a": ["a tall teenage Canadian boy"]}, {"t": "a garden (big / green)", "a": ["a big green garden"]}, {"t": "a castle (medieval / impressive)", "a": ["an impressive medieval castle"]}, {"t": "a cat (white / fluffy / little)", "a": ["a fluffy little white cat", "a little fluffy white cat"]}, {"t": "a shirt (cotton / checked)", "a": ["a checked cotton shirt"]}]}, {"type": "order", "n": 6, "title": "One sentence", "task": "Write each pair of sentences as one sentence.", "items": [{"t": "I met a Polish man at the conference. He was very funny.", "a": ["I met a very funny Polish man at the conference.", "I met a funny Polish man at the conference."]}, {"t": "My aunt has beautiful red hair. It's curly.", "a": ["My aunt has beautiful curly red hair."]}, {"t": "Oleh has bought an expensive leather jacket. It's black.", "a": ["Oleh has bought an expensive black leather jacket."]}, {"t": "They live in a modern flat. It's small.", "a": ["They live in a small modern flat."]}, {"t": "She was wearing a long dress. It was silk and it was blue.", "a": ["She was wearing a long blue silk dress."]}, {"t": "We stayed in a lovely hotel. It was old and Spanish.", "a": ["We stayed in a lovely old Spanish hotel."]}]}];
const show={"have not":"haven't","has not":"hasn't","was not":"wasn't","were not":"weren't","did not":"didn't","is not":"isn't","are not":"aren't","does not":"doesn't","do not":"don't","am not":"'m not"};
function norm(s){
  s=' '+s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:]/g,' ')+' ';
  s=s.replace(/won't/g,'will not').replace(/n't/g,' not').replace(/'s /g,' is ').replace(/'m /g,' am ').replace(/'re /g,' are ').replace(/'ve /g,' have ');
  return s.replace(/\s+/g,' ').trim();
}
function normL(s){s=norm(s.replace(/-/g,' ')).replace(/\bper cent\b/g,'percent').replace(/\band\b/g,' ').replace(/^a /,'one ');return s.replace(/\s+/g,' ').trim();}
const pretty=a=>{for(const k in show)a=a.replace(k,show[k]);return a;};
const mk=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const wrap=document.getElementById('secs'); const checks=[];
SECS.forEach((sec,si)=>{
  const card=mk('div','card'+(sec.type==='explain'?' explain':''));
  if(sec.type==='explain'){card.innerHTML=sec.html;wrap.append(card);return;}
  const h=mk('h2');h.append(mk('span','num',String(sec.n)),sec.title);const sc=mk('span','secscore');h.append(sc);card.append(h);
  card.append(mk('p','task',sec.task));
  if(sec.bank){const b=mk('div','bank');sec.bank.forEach(w=>b.append(mk('span','',w)));card.append(b);}
  const ol=mk('ol');card.append(ol);wrap.append(card);
  const fns=[];
  sec.items.forEach(it=>{
    const li=mk('li','q');ol.append(li);const fix=mk('div','fix');
    if(sec.type==='match'){
      li.append(mk('span','word',it[0]));const s=mk('select');s.append(new Option('— вибери —',''));
      sec.pool.slice().sort((a,b)=>a.localeCompare(b)).forEach(p=>s.append(new Option(p,p)));li.append(s,fix);
      fns.push(()=>{const ok=s.value===it[1];s.disabled=true;fix.textContent=ok?'':'✗ Правильно: '+it[1];return [li,ok];});
      li._reset=()=>{s.value='';s.disabled=false;};
    } else if(sec.type==='choice'){
      const parts=it.t.split('___');let pick=-1;li.append(parts[0]);
      const o=mk('span','opts');it.o.forEach((w,k)=>{const b=mk('button','opt',w);b.type='button';b.onclick=()=>{if(li.dataset.done)return;pick=k;o.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};o.append(b);});
      li.append(o,parts[1]||'',fix);
      fns.push(()=>{const ok=pick===it.c;o.querySelectorAll('.opt').forEach((b,k)=>{b.classList.remove('sel');if(k===it.c)b.classList.add('right');else if(k===pick)b.classList.add('wrong');});fix.textContent=ok?'':'✗ Правильно: '+it.o[it.c];return [li,ok];});
      li._reset=()=>{pick=-1;o.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel','right','wrong'));};
    } else if(sec.type==='order'){
      li.append(mk('span','hint',it.t),mk('br'));const inp=mk('input','wide');inp.type='text';inp.autocomplete='off';inp.spellcheck=false;li.append(inp,fix);
      fns.push(()=>{const ok=it.a.some(a=>norm(a)===norm(inp.value));inp.readOnly=true;fix.textContent=ok?'':'✗ Правильно: '+it.a[0];return [li,ok];});
      li._reset=()=>{inp.value='';inp.readOnly=false;};
    } else {
      const segs=it.t.split(/\[([^\]]+)\]/);const ins=[];
      segs.forEach((s,k)=>{if(k%2===0){li.append(s);}else{const inp=mk('input');inp.type='text';inp.autocomplete='off';inp.spellcheck=false;inp.setAttribute('autocapitalize','off');ins.push(inp);li.append(inp);if(s!=='?')li.append(' ',mk('span','hint','('+s+')'));}});
      li.append(fix);
      fns.push(()=>{let all=true;const corr=[];ins.forEach((inp,k)=>{const acc=it.a[k];const N=sec.loose?normL:norm;const g=N(inp.value);const ok=acc.some(a=>N(a)===g)||acc.some(a=>/^has /.test(a)&&a.replace(/^has /,'is ')===g);inp.readOnly=true;inp.classList.add(ok?'ok1':'bad1');if(!ok)all=false;corr.push(acc.map(pretty).filter((v,j,a)=>a.indexOf(v)===j).join(' / '));});
        fix.textContent=all?'':'✗ Правильно: '+corr.join('  …  ');return [li,all];});
      li._reset=()=>{ins.forEach(i=>{i.value='';i.readOnly=false;i.classList.remove('ok1','bad1');});};
    }
  });
  checks.push({fns,sc,n:sec.items.length,ol});
});
const $=id=>document.getElementById(id);
$('check').onclick=()=>{let t=0,m=0;checks.forEach(c=>{let s=0;c.fns.forEach(f=>{const [li,ok]=f();li.dataset.done='1';li.classList.add(ok?'ok':'bad');if(ok)s++;});c.sc.textContent=s+' / '+c.n;t+=s;m+=c.n;});
  $('check').disabled=true;$('result').style.display='block';$('score').textContent=t+' / '+m;$('result').scrollIntoView({behavior:'smooth'});};
$('again').onclick=()=>{document.querySelectorAll('li.q').forEach(li=>{li.classList.remove('ok','bad');delete li.dataset.done;li.querySelector('.fix').textContent='';li._reset&&li._reset();});
  checks.forEach(c=>c.sc.textContent='');$('check').disabled=false;$('result').style.display='none';window.scrollTo({top:0,behavior:'smooth'});};
</script></body></html>
